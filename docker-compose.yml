services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fast_todo_db
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d fast_todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Migration Service
  migrate:
    build: .
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://todouser:todopass@db:5432/fast_todo_db
      SECRET_KEY: your-secret-key-here-change-in-production
      ALGORITHM: HS256
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # FastAPI Application
  api:
    build: .
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://todouser:todopass@db:5432/fast_todo_db
      SECRET_KEY: your-secret-key-here-change-in-production
      ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: